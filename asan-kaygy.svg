<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sunsetBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="35%" stop-color="#2c1e28"/>
      <stop offset="65%" stop-color="#723d2b"/>
      <stop offset="85%" stop-color="#c47838"/>
      <stop offset="100%" stop-color="#2a1a10"/>
    </linearGradient>
    <radialGradient id="sunDisk" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#ffea79"/>
      <stop offset="35%" stop-color="#f39c12"/>
      <stop offset="70%" stop-color="#c47838" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2c1e28" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="duneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e1a12"/>
      <stop offset="100%" stop-color="#140a05"/>
    </linearGradient>
  </defs>

  <!-- Sunset Sky -->
  <rect width="600" height="400" fill="url(#sunsetBg)"/>

  <!-- Vast Steppe Sun on the Horizon -->
  <circle cx="380" cy="240" r="130" fill="url(#sunDisk)"/>
  <circle cx="380" cy="240" r="45" fill="#ffe066" opacity="0.9"/>

  <!-- Distant Steppe Horizon & Hills -->
  <path d="M0 270 Q180 250 360 265 T600 255 L600 400 L0 400 Z" fill="#24140e" opacity="0.7"/>

  <!-- Asan Kaygı riding his legendary swift camel Jelmaya -->
  <g transform="translate(140, 160)">
    <!-- Jelmaya (The Swift Steppe She-Camel) Silhouette -->
    <!-- Front Leg & Hooves -->
    <path d="M125 105 L135 170 L140 170 L132 105 Z" fill="#110804"/>
    <path d="M110 105 L100 170 L95 170 L104 105 Z" fill="#110804"/>
    <!-- Hind Legs -->
    <path d="M45 100 L35 170 L30 170 L40 100 Z" fill="#110804"/>
    <path d="M60 100 L70 170 L75 170 L65 100 Z" fill="#110804"/>
    
    <!-- Camel Body & Single High Hump (Dromedary / Jelmaya) -->
    <path d="M30 85 C35 65 60 45 75 40 C90 35 110 55 125 75 C135 85 140 95 130 105 C115 112 45 112 30 85 Z" fill="#180e08"/>
    
    <!-- Camel Long Curved Graceful Neck & Head -->
    <path d="M125 75 C135 60 150 45 165 30 C175 20 185 15 190 20 C195 24 190 32 180 40 C165 55 150 80 140 95 Z" fill="#180e08"/>
    <!-- Camel Head Profile & Ears -->
    <path d="M185 15 C192 10 200 12 205 16 C205 20 198 25 190 24 Z" fill="#180e08"/>
    <path d="M185 14 L182 8 L187 11 Z" fill="#180e08"/>

    <!-- Saddle & Steppe Blankets (Terlik) -->
    <ellipse cx="80" cy="48" rx="28" ry="10" fill="#8c2f1b"/>
    <path d="M65 48 Q80 55 95 48" stroke="#d4af37" stroke-width="2" fill="none"/>

    <!-- Asan Kaygı (The Sage-Poet) Sitting Thoughtfully on Camel -->
    <!-- Robe / Chapan -->
    <path d="M70 42 C68 28 72 16 80 12 C88 16 92 28 90 42 Z" fill="#1e293b"/>
    <!-- Sage Hat / Timpak / Borik -->
    <path d="M76 12 C76 4 84 4 84 12 Z" fill="#b45309" stroke="#d4af37" stroke-width="0.8"/>
    <!-- Staff of the Pilgrim / Wanderer (Asa Tayaq) -->
    <line x1="95" y1="5" x2="82" y2="55" stroke="#d4af37" stroke-width="1.8"/>
    <!-- Gaze directed towards the promised horizon -->
    <circle cx="80" cy="12" r="4" fill="#d4af37" opacity="0.6"/>
    <!-- Reins (Tizgin) held loosely -->
    <path d="M85 30 Q130 40 182 22" stroke="#d4af37" stroke-width="0.9" fill="none" opacity="0.75"/>
  </g>

  <!-- Foreground Steppe Dunes -->
  <path d="M0 320 Q240 280 440 330 T600 310 L600 400 L0 400 Z" fill="url(#duneGrad)"/>

  <!-- Steppe Wind & Whispering Grasses (Jeruyık's Call) -->
  <g stroke="#d4af37" stroke-width="1" opacity="0.5" fill="none">
    <path d="M80 370 Q110 330 140 340"/>
    <path d="M220 380 Q250 345 280 355"/>
    <path d="M460 375 Q490 335 520 345"/>
    <path d="M50 340 Q150 330 250 335"/>
  </g>

  <!-- Kazakh Ornamental Border Frame -->
  <g stroke="#d4af37" stroke-width="1.5" fill="none" opacity="0.5">
    <rect x="15" y="15" width="570" height="370" rx="4"/>
    <circle cx="300" cy="15" r="4" fill="#d4af37"/>
    <circle cx="300" cy="385" r="4" fill="#d4af37"/>
  </g>
</svg>

