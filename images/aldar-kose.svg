<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="aldarBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1120"/>
      <stop offset="50%" stop-color="#19182b"/>
      <stop offset="85%" stop-color="#3d2218"/>
      <stop offset="100%" stop-color="#1f110c"/>
    </linearGradient>
    <radialGradient id="fireGlow" cx="62%" cy="68%" r="45%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#e65100" stop-opacity="0.45"/>
      <stop offset="80%" stop-color="#19182b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#aldarBg)"/>

  <!-- Campfire Glow -->
  <circle cx="370" cy="270" r="160" fill="url(#fireGlow)"/>

  <!-- Night Sky Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="50" r="1.5"/>
    <circle cx="150" cy="80" r="1"/>
    <circle cx="230" cy="40" r="2"/>
    <circle cx="310" cy="70" r="1"/>
    <circle cx="470" cy="45" r="2"/>
    <circle cx="530" cy="85" r="1.5"/>
  </g>

  <!-- Steppe Horizon & Distant Yurt -->
  <path d="M0 310 Q200 280 400 300 T600 290 L600 400 L0 400 Z" fill="#140f16"/>
  <!-- Distant Yurt Silhouette -->
  <path d="M90 295 C90 285 105 278 115 278 C125 278 140 285 140 295 Z" fill="#241a22"/>
  <rect x="90" y="295" width="50" height="12" fill="#1b1319"/>

  <!-- Campfire (Oshaq / Ot) -->
  <g transform="translate(350, 260)">
    <!-- Logs -->
    <line x1="-20" y1="20" x2="30" y2="10" stroke="#422517" stroke-width="6" stroke-linecap="round"/>
    <line x1="25" y1="20" x2="-25" y2="10" stroke="#361c10" stroke-width="6" stroke-linecap="round"/>
    <!-- Flames -->
    <path d="M0 15 Q-15 -10 0 -25 Q10 -40 2 -48 Q15 -30 20 -15 Q25 0 0 15 Z" fill="#ffb703"/>
    <path d="M-5 15 Q-18 0 -5 -18 Q5 -30 2 -35 Q10 -20 12 -5 Z" fill="#ff5722"/>
    <path d="M2 15 Q-2 2 2 -10 Q8 -18 3 -22 Q8 -12 7 5 Z" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Sparks rising into the dark sky -->
  <g fill="#ffea79">
    <circle cx="372" cy="205" r="1.5"/>
    <circle cx="360" cy="185" r="1"/>
    <circle cx="380" cy="165" r="1.5"/>
    <circle cx="365" cy="140" r="1"/>
    <circle cx="390" cy="120" r="0.8"/>
  </g>

  <!-- Aldar Köse Silhouette & Profile Character -->
  <g transform="translate(190, 150)">
    <!-- Patchwork Fox-fur Coat (Tomaq / Koton Shapan) -->
    <path d="M30 140 C20 110 35 75 55 60 C75 55 95 60 110 80 C115 100 110 130 95 140 Z" fill="#242838" stroke="#d4af37" stroke-width="1"/>
    <!-- Patchwork stitches on coat -->
    <line x1="55" y1="80" x2="65" y2="90" stroke="#d4af37" stroke-width="1.5"/>
    <line x1="52" y1="88" x2="68" y2="82" stroke="#d4af37" stroke-width="1.5"/>
    <line x1="85" y1="100" x2="95" y2="110" stroke="#e65100" stroke-width="1.5"/>
    <line x1="82" y1="108" x2="98" y2="102" stroke="#e65100" stroke-width="1.5"/>

    <!-- Head Profile (Beardless 'Köse' chin, clever smirk) -->
    <circle cx="85" cy="42" r="16" fill="#f5d7b5"/>
    <!-- Nose & Eye (playful squint) -->
    <path d="M96 38 L104 42 L96 46 Z" fill="#f5d7b5"/>
    <circle cx="92" cy="38" r="2" fill="#1f1812"/>
    <!-- Laughing smile / smirk (no beard - true to 'Köse') -->
    <path d="M92 48 Q98 52 102 46" stroke="#8c2f1b" stroke-width="2" fill="none"/>
    <!-- Smooth beardless jawline -->
    <path d="M85 58 C92 58 98 54 100 50" stroke="#e0a96d" stroke-width="1.5" fill="none"/>

    <!-- Traditional Pointed Kazakh Hat (Borik / Kalpak with fur brim) -->
    <path d="M70 34 C70 15 90 2 95 0 C96 0 105 15 108 34 Z" fill="#b45309"/>
    <!-- Fur brim -->
    <ellipse cx="89" cy="33" rx="20" ry="7" fill="#4a2c16" stroke="#d4af37" stroke-width="1"/>
    <!-- Feather / Aibash tip -->
    <path d="M95 0 Q105 -12 110 -8" stroke="#ffffff" stroke-width="2" fill="none"/>

    <!-- Hand holding a cunning pouch of coins won from a greedy bai -->
    <path d="M105 95 L125 110 L135 100" stroke="#f5d7b5" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Coin pouch / Torba -->
    <path d="M125 100 C125 90 145 90 145 100 C150 115 145 130 135 130 C125 130 120 115 125 100 Z" fill="#d4af37"/>
    <ellipse cx="135" cy="98" rx="8" ry="3" fill="#8c2f1b"/>
    <!-- Gold coins spilling / glistening -->
    <circle cx="140" cy="115" r="3" fill="#ffe066" stroke="#996515" stroke-width="0.5"/>
  </g>

  <!-- Foreground Camp Ground -->
  <path d="M0 340 Q300 320 600 340 L600 400 L0 400 Z" fill="#100a06"/>

  <!-- Kazakh Ornamental Border Frame -->
  <g stroke="#d4af37" stroke-width="1.5" fill="none" opacity="0.5">
    <rect x="15" y="15" width="570" height="370" rx="4"/>
    <circle cx="300" cy="15" r="4" fill="#d4af37"/>
    <circle cx="300" cy="385" r="4" fill="#d4af37"/>
  </g>
</svg>

