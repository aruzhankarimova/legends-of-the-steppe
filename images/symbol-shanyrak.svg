<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="symShanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffea79" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#d4af37" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b172a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="300" rx="16" fill="#0c1728"/>
  <circle cx="150" cy="150" r="120" fill="url(#symShanGlow)"/>

  <!-- Outer Frame -->
  <circle cx="150" cy="150" r="105" fill="#122036" stroke="#d4af37" stroke-width="2"/>

  <!-- Sacred Shanyrak (Yurt Crown) -->
  <g transform="translate(150, 150)">
    <!-- Outer Heavy Wooden Rim (Toğıq) -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="#d4af37" stroke-width="8"/>
    <circle cx="0" cy="0" r="79" fill="none" stroke="#ffd166" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="71" fill="none" stroke="#8c6d3b" stroke-width="1.5"/>

    <!-- Inner Golden Circle / Sky Aperture -->
    <circle cx="0" cy="0" r="66" fill="#1a2d4c"/>

    <!-- Arched Wooden Crossbars (Külbireu / Küldireuish) creating the vaulted dome -->
    <!-- Set of 3 Arcs Horizontal Direction -->
    <path d="M-64 -22 Q0 8 64 -22" stroke="#d4af37" stroke-width="3" fill="none"/>
    <path d="M-66 0 Q0 30 66 0" stroke="#ffd166" stroke-width="3.5" fill="none"/>
    <path d="M-64 22 Q0 52 64 22" stroke="#d4af37" stroke-width="3" fill="none"/>

    <!-- Set of 3 Arcs Vertical Direction Crossing -->
    <path d="M-22 -64 Q8 0 -22 64" stroke="#d4af37" stroke-width="3" fill="none"/>
    <path d="M0 -66 Q30 0 0 66" stroke="#ffd166" stroke-width="3.5" fill="none"/>
    <path d="M22 -64 Q52 0 22 64" stroke="#d4af37" stroke-width="3" fill="none"/>

    <!-- Sun Ray Accents radiating from Shanyrak rim -->
    <g stroke="#ffd166" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-85" x2="0" y2="-98"/>
      <line x1="0" y1="85" x2="0" y2="98"/>
      <line x1="-85" y1="0" x2="-98" y2="0"/>
      <line x1="85" y1="0" x2="98" y2="0"/>
      <line x1="-60" y1="-60" x2="-70" y2="-70"/>
      <line x1="60" y1="-60" x2="70" y2="-70"/>
      <line x1="-60" y1="60" x2="-70" y2="70"/>
      <line x1="60" y1="60" x2="70" y2="70"/>
    </g>

    <!-- Center Radiant Star (Tengri's blessing) -->
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
  </g>
</svg>

