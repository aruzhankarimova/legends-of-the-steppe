<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="symKorkytGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8c5822" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0b172a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="300" rx="16" fill="#0c1626"/>
  <circle cx="150" cy="150" r="120" fill="url(#symKorkytGlow)"/>

  <!-- Celestial Ring with Traditional Border -->
  <circle cx="150" cy="150" r="100" fill="#132035" stroke="#d4af37" stroke-width="2"/>
  <circle cx="150" cy="150" r="88" fill="#1a2b45" stroke="#b38a28" stroke-width="1" stroke-dasharray="3,5"/>

  <!-- Korkyt Sage Silhouette with Floating Sound Waves -->
  <g transform="translate(150, 140)">
    <!-- Aura / Music Waves -->
    <path d="M-60 -20 Q0 -60 60 -20" stroke="#ffd166" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M-75 10 Q0 -35 75 10" stroke="#d4af37" stroke-width="1.2" fill="none" opacity="0.5"/>
    <path d="M-85 40 Q0 -10 85 40" stroke="#f5d77f" stroke-width="1" fill="none" opacity="0.4"/>

    <!-- Sage Head & Kalpak -->
    <path d="M-15 -42 Q0 -70 15 -42 Z" fill="#2d3748" stroke="#d4af37" stroke-width="1.5"/>
    <circle cx="0" cy="-35" r="14" fill="#f1f5f9"/>
    <!-- Flowing Beard -->
    <path d="M-8 -30 C-10 -5 0 15 0 25 C0 15 10 -5 8 -30 Z" fill="#e2e8f0"/>
    
    <!-- Robe -->
    <path d="M-30 0 C-25 15 -35 45 -40 70 L40 70 C35 45 25 15 30 0 Z" fill="#0f172a" stroke="#d4af37" stroke-width="1"/>
    
    <!-- Kobyz in Hand -->
    <line x1="0" y1="-10" x2="0" y2="60" stroke="#d4af37" stroke-width="3"/>
    <ellipse cx="0" cy="30" rx="12" ry="14" fill="#2d1c12" stroke="#d4af37" stroke-width="1.5"/>
    <ellipse cx="0" cy="52" rx="15" ry="16" fill="#1f140d" stroke="#ffd166" stroke-width="1.5"/>
    <!-- Bow across strings -->
    <line x1="-25" y1="36" x2="25" y2="28" stroke="#ffd166" stroke-width="2"/>
  </g>
</svg>

