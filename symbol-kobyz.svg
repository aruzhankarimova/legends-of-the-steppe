<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="symKobyzGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#c59e3f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0b172a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="300" rx="16" fill="#0d1624"/>
  <circle cx="150" cy="150" r="120" fill="url(#symKobyzGlow)"/>

  <!-- Outer Ring with Kazakh Ornament Punctuation -->
  <circle cx="150" cy="150" r="105" fill="#131e30" stroke="#d4af37" stroke-width="2"/>
  <circle cx="150" cy="150" r="95" fill="#192840" stroke="#8c6d3b" stroke-width="1"/>

  <!-- Kobyz Instrument Details -->
  <g transform="translate(150, 150)">
    <!-- Instrument Neck carved from single birch/maple wood -->
    <path d="M-4 -85 L-4 50 L4 50 L4 -85 Z" fill="#8c5822" stroke="#d4af37" stroke-width="1"/>
    
    <!-- Swan-shaped Headstock (Aqqū bas) -->
    <path d="M0 -85 C-12 -95 -16 -108 -6 -112 C6 -115 12 -105 2 -85" fill="none" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>
    <!-- Tuning Pegs (Qūlaqtar) -->
    <line x1="-15" y1="-80" x2="15" y2="-80" stroke="#ffd166" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-15" y1="-68" x2="15" y2="-68" stroke="#ffd166" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-15" cy="-80" r="3" fill="#ffe066"/>
    <circle cx="15" cy="-68" r="3" fill="#ffe066"/>

    <!-- Upper Resonator Bowl (Open to the heavens) -->
    <ellipse cx="0" cy="-10" rx="28" ry="34" fill="#2d1c12" stroke="#d4af37" stroke-width="2"/>
    <ellipse cx="0" cy="-10" rx="20" ry="26" fill="#140a05"/>
    <!-- Internal sacred mirrors / lead bells (Qoñyrau) -->
    <circle cx="0" cy="-10" r="4" fill="#ffd166"/>

    <!-- Lower Resonator Bowl (Covered in taut camel skin / Tüyeniñ terisi) -->
    <ellipse cx="0" cy="55" rx="34" ry="40" fill="#3d2719" stroke="#d4af37" stroke-width="2.5"/>
    <ellipse cx="0" cy="55" rx="28" ry="34" fill="#4d3221" opacity="0.9"/>
    <!-- Wooden Bridge (Tiyek) on camel skin -->
    <rect x="-14" y="52" width="28" height="6" rx="2" fill="#d4af37"/>

    <!-- Horsehair Strings (Qyl) -->
    <line x1="-5" y1="-80" x2="-5" y2="85" stroke="#fcf6e8" stroke-width="1.8"/>
    <line x1="5" y1="-80" x2="5" y2="85" stroke="#fcf6e8" stroke-width="1.8"/>

    <!-- Curved Horsehair Bow (Jaq) crossing at an angle -->
    <path d="M-65 20 Q-10 65 65 30" stroke="#d4af37" stroke-width="3" fill="none"/>
    <line x1="-62" y1="22" x2="62" y2="32" stroke="#ffffff" stroke-width="1.2" opacity="0.9"/>
  </g>
</svg>

