<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="symBayGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffe066" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#d4af37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0b172a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="300" rx="16" fill="#0b1526"/>
  <circle cx="150" cy="150" r="120" fill="url(#symBayGlow)"/>

  <!-- Outer Ring with Cosmic Marks -->
  <circle cx="150" cy="150" r="105" fill="#101c30" stroke="#d4af37" stroke-width="2"/>
  <circle cx="150" cy="150" r="95" fill="#162640" stroke="#ffd166" stroke-width="1" stroke-dasharray="2,4"/>

  <!-- Bayterek Cosmic Tree of Life -->
  <g transform="translate(150, 150)">
    <!-- Golden Egg (Altyn Zhumyrtka) at the Top -->
    <ellipse cx="0" cy="-65" rx="16" ry="20" fill="#ffe066" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="-3" cy="-70" r="4" fill="#ffffff" opacity="0.8"/>

    <!-- Celestial Foliage & Boughs (Heaven Realm) -->
    <g stroke="#d4af37" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M0 -45 C-25 -55 -45 -40 -60 -25"/>
      <path d="M0 -45 C25 -55 45 -40 60 -25"/>
      <path d="M-20 -35 C-40 -30 -50 -15 -55 5"/>
      <path d="M20 -35 C40 -30 50 -15 55 5"/>
    </g>

    <!-- Leaves / Golden Buds of Life -->
    <g fill="#ffd166">
      <circle cx="-60" cy="-25" r="4"/>
      <circle cx="60" cy="-25" r="4"/>
      <circle cx="-55" cy="5" r="4"/>
      <circle cx="55" cy="5" r="4"/>
      <circle cx="-35" cy="-50" r="3"/>
      <circle cx="35" cy="-50" r="3"/>
    </g>

    <!-- Strong Mighty Trunk (Middle Earth) -->
    <path d="M-6 -45 L-10 40 L10 40 L6 -45 Z" fill="#8c5822" stroke="#d4af37" stroke-width="1.5"/>
    <line x1="0" y1="-45" x2="0" y2="40" stroke="#d4af37" stroke-width="1.5"/>

    <!-- Earth Boundary line -->
    <line x1="-70" y1="40" x2="70" y2="40" stroke="#ffd166" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Deep Roots in the Underworld -->
    <g stroke="#6b441b" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M-6 40 C-20 60 -35 70 -50 80"/>
      <path d="M6 40 C20 60 35 70 50 80"/>
      <path d="M0 40 C-5 65 -15 75 -20 85"/>
      <path d="M0 40 C5 65 15 75 20 85"/>
    </g>
  </g>
</svg>

